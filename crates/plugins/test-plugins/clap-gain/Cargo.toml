[package]
name = "clap-gain"
description = "A tiny CLAP plugin for the plugins crate's tests: a gain effect and a sine instrument"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
clap-sys.workspace = true

# The test editor: an X11 child window driven by the host's timers and fd
# watching.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb.workspace = true
