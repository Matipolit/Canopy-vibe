[package]
name = "flp"
description = "Reads FL Studio projects (.flp) and turns them into canopy projects."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
effects.workspace = true
instruments.workspace = true
midi.workspace = true
# The ids and saved-state layouts canopy's plugin host uses, for third-party
# plugins imported as themselves. No editor windows needed here.
plugins = { path = "../plugins", default-features = false }
project.workspace = true
# Vital keeps its presets as JSON inside its saved state, Kilohearts as
# JSON zipped into it.
serde_json.workspace = true
miniz_oxide.workspace = true

[dev-dependencies]
# The tests read real WAV files for the audio clips they import.
media.workspace = true
