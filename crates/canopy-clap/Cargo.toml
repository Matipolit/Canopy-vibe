[package]
name = "canopy-clap"
description = "Canopy instruments and effects as CLAP plugins, with a visual Shaper editor"
version.workspace = true
edition.workspace = true
publish.workspace = true

# A host loads the `cdylib`; the tests use the `rlib`. `tools/package-clap.sh`
# builds it and names it `canopy.clap`.
[lib]
name = "canopy_clap"
crate-type = ["cdylib", "rlib"]

[features]
# Separate effects bundle, alongside the existing instrument-only canopy.clap.
effects-only = []

[dependencies]
canopy-widgets.workspace = true
effects.workspace = true
egui = "0.36"
egui-baseview = { version = "=0.7.0", default-features = false, features = ["opengl", "log"] }
raw-window-handle = "0.6"
clap-sys.workspace = true
dsp.workspace = true
instruments.workspace = true
midi.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
canopy-widgets = { workspace = true, features = ["testing"] }
egui_kittest = { version = "0.36", features = ["wgpu"] }
assert_no_alloc.workspace = true
plugins.workspace = true
