[package]
name = "engine"
description = "The audio thread: runs the DSP graph and talks to the UI through lock-free queues."
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = ["cpal"]
# Real audio devices (`device.rs`): cpal, and on Linux PipeWire, whose library
# is loaded at run time (`pipewire/`), so building needs no PipeWire packages.
cpal = ["dep:cpal", "dep:libloading"]
# Play through an ASIO driver on Windows instead of WASAPI, for lower latency.
# Builds Steinberg's ASIO SDK (GPLv3, or Steinberg's own licence), which cpal
# downloads at build time, and needs LLVM. See "Building for Windows" in the README.
asio = ["cpal", "cpal/asio"]

[dependencies]
dsp.workspace = true
effects.workspace = true
instruments.workspace = true
media.workspace = true
midi.workspace = true
project.workspace = true
ron.workspace = true
assert_no_alloc.workspace = true
rtrb.workspace = true
cpal = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libloading = { workspace = true, optional = true }
# The audio thread's running time and its real-time limit (overload.rs).
libc.workspace = true

# On Windows, run the audio thread under MMCSS (its "Audio" task), as Windows audio
# apps do: without `realtime`, cpal leaves WASAPI's thread at normal priority.
# Not on Linux, where `realtime` would ask for a real-time scheduler instead.
[target.'cfg(windows)'.dependencies]
cpal = { workspace = true, optional = true, features = ["realtime"] }
# The render workers' thread priority (pool.rs).
windows-sys = { workspace = true, features = ["Win32_System_Threading"] }

# The play_project example's background renders run at idle priority.
[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true
